description: |
  Cámara térmica TOPDON TC002 (TCView) para iPhone y iPad con conector Lightning. Se conecta directo al equipo y se usa con la app gratuita TC View.

  - Sensor infrarrojo de 256 x 192.
  - Sensibilidad térmica de 40 mK.
  - Permite tomar fotos y grabar video térmico.
  - Incluye su estuche rígido de transporte.

  La compré en Amazon México en mayo de 2024 en $6,170 y casi no la usé. Ver fotos y video.

  Útil para detectar fugas de calor o de agua, fallas eléctricas, sobrecalentamiento en equipos, problemas de aislamiento y mascotas o fauna de noche.

  Ojo: solo es compatible con iPhone/iPad con puerto Lightning (no USB-C).

  Entrega en Atlixco y Lomas de Angelópolis, o envío por Mercado Envíos. Cualquier duda, pregúntame.
