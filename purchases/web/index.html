<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis compras</title>
<style>
  :root { --blue: #3483fa; --green: #00a650; --text: rgba(0,0,0,.9); --muted: rgba(0,0,0,.55); }
  * { box-sizing: border-box; }
  body { margin: 0; background: #ededed; color: var(--text);
         font-family: "Proxima Nova", -apple-system, "Helvetica Neue", Arial, sans-serif; }
  header { background: #fff159; padding: 12px 24px; position: sticky; top: 0; z-index: 2;
           box-shadow: 0 1px 0 rgba(0,0,0,.1); }
  .bar { max-width: 1200px; margin: 0 auto; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .logo { font-weight: 700; font-size: 20px; color: #2d3277; white-space: nowrap; }
  #q { flex: 1; min-width: 240px; border: 0; border-radius: 2px; padding: 11px 14px; font-size: 16px;
       box-shadow: 0 1px 2px rgba(0,0,0,.2); outline: none; }
  select { border: 0; border-radius: 2px; padding: 10px; font-size: 14px; background: #fff;
           box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .chips { max-width: 1200px; margin: 10px auto 0; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .chip { border: 0; border-radius: 16px; padding: 6px 14px; font-size: 14px; cursor: pointer;
          background: rgba(255,255,255,.7); color: #2d3277; }
  .chip.on { background: var(--blue); color: #fff; }
  #stats { margin-left: auto; font-size: 14px; color: #2d3277; }
  main { max-width: 1200px; margin: 24px auto; padding: 0 24px;
         display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .card { background: #fff; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column;
          box-shadow: 0 1px 2px rgba(0,0,0,.12); text-decoration: none; color: inherit; transition: box-shadow .15s; }
  .card:hover { box-shadow: 0 7px 16px rgba(0,0,0,.18); }
  .pic { position: relative; aspect-ratio: 1; background: #f5f5f5; display: flex; align-items: center; justify-content: center; }
  .pic img { position: absolute; inset: 6%; width: 88%; height: 88%; object-fit: contain; mix-blend-mode: multiply; }
  .pic .none { font-size: 56px; opacity: .25; }
  .badge { position: absolute; left: 16px; bottom: 16px; background: var(--blue); color: #fff;
           font-weight: 700; font-size: 12px; padding: 3px 6px; border-radius: 2px; text-transform: uppercase; }
  .badge.meli { background: #fff159; color: #2d3277; }
  .badge.us { background: #232f3e; }
  .badge.ali { background: #e62e04; }
  .body { padding: 16px; display: flex; flex-direction: column; gap: 6px; }
  .title { font-size: 15px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2;
           -webkit-box-orient: vertical; overflow: hidden; }
  .brand { font-size: 13px; font-weight: 700; text-transform: uppercase; }
  .meta { font-size: 13px; color: var(--muted); }
  .meta .star { color: var(--blue); }
  .old { font-size: 13px; color: var(--muted); }
  .price { font-size: 28px; font-weight: 300; display: flex; align-items: flex-start; gap: 6px; }
  .price sup { font-size: 13px; margin-top: 4px; margin-left: -4px; }
  .price .cur { font-size: 12px; font-weight: 600; background: var(--green); color: #fff; padding: 2px 4px;
                border-radius: 2px; align-self: center; }
  .green { color: var(--green); font-size: 14px; }
  .pill { align-self: flex-start; font-size: 14px; padding: 2px 6px; border-radius: 3px; }
  .pill.ok { background: #e6f7ee; color: var(--green); font-weight: 600; }
  .pill.warn { background: #fff4e5; color: #b26b00; font-weight: 600; }
  .pill.link { background: #e3edfb; color: var(--blue); }
  #more { grid-column: 1 / -1; justify-self: center; margin: 8px 0 24px; }
  #more button { border: 0; background: var(--blue); color: #fff; padding: 12px 24px; border-radius: 6px; font-size: 15px; cursor: pointer; }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 48px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <span class="logo">Mis compras</span>
    <input id="q" type="search" placeholder="Buscar en mis compras…" autofocus>
    <select id="sort">
      <option value="new">Más recientes</option>
      <option value="old">Más antiguas</option>
      <option value="high">Mayor precio</option>
      <option value="low">Menor precio</option>
    </select>
  </div>
  <div class="chips" id="chips"><span id="stats"></span></div>
</header>
<main id="grid"></main>
<script>
const $ = id => document.getElementById(id);
const state = { q: "", store: "all", sort: "new", offset: 0 };
let request = 0;

const money = n => (n ?? 0).toLocaleString("es-MX", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtDate = d => new Date(d + "T12:00").toLocaleDateString("es-MX", { day: "numeric", month: "short", year: "numeric" });
function ago(d) {
  const months = Math.round((Date.now() - new Date(d)) / 2.63e9), years = Math.round(months / 12);
  return months < 1 ? "este mes" : months < 12 ? `hace ${months} ${months === 1 ? "mes" : "meses"}`
    : `hace ${years} ${years === 1 ? "año" : "años"}`;
}
function statusPill(s) {
  const t = (s || "").toLowerCase();
  if (!t || /closed|entreg|shipped|deliver/.test(t)) return `<span class="pill ok">Entregado</span>`;
  if (/cancel/.test(t)) return `<span class="pill warn">Cancelado</span>`;
  if (/return|devol|refund|reembols/.test(t)) return `<span class="pill warn">Devuelto</span>`;
  return `<span class="pill ok">${esc(s)}</span>`;
}
function noImage(img) {
  img.replaceWith(Object.assign(document.createElement("span"), { className: "none", textContent: "📦" }));
}

function card(i, label) {
  const [whole, cents] = money(i.total).split(".");
  const badgeClass = i.store === "mercadolibre" ? "meli" : i.store === "amazon.com" ? "us" : i.store === "aliexpress" ? "ali" : "";
  const pic = i.image ? `<img loading="lazy" src="${esc(i.image)}" alt="" onerror="noImage(this)">` : `<span class="none">📦</span>`;
  return `<a class="card" href="${esc(i.url)}" target="_blank" rel="noopener">
    <div class="pic">${pic}<span class="badge ${badgeClass}">${esc(label)}</span></div>
    <div class="body">
      <div class="title">${esc(i.product)}</div>
      ${i.brand ? `<div class="brand">${esc(i.brand)}</div>` : ""}
      <div class="meta"><span class="star">★</span> ${fmtDate(i.date)} | ${i.qty} ${i.qty === 1 ? "unidad" : "unidades"}</div>
      ${i.qty > 1 ? `<div class="old">$ ${money(i.unit)} c/u</div>` : ""}
      <div class="price">$ ${whole}${cents !== "00" ? `<sup>${cents}</sup>` : ""}<span class="cur">${esc(i.currency)}</span></div>
      <div class="green">Comprado ${ago(i.date)}</div>
      ${statusPill(i.status)}
    </div></a>`;
}

async function load(append = false) {
  if (!append) state.offset = 0;
  const id = ++request;
  const res = await fetch("/api/purchases?" + new URLSearchParams(state));
  if (id !== request) return; // a newer search already started
  const data = await res.json();

  const labels = Object.fromEntries(data.stores.map(s => [s.key, s.label]));
  const all = data.stores.reduce((n, s) => n + s.count, 0);
  $("chips").innerHTML = [{ key: "all", label: "Todas", count: all }, ...data.stores]
    .map(s => `<button class="chip${s.key === state.store ? " on" : ""}" data-store="${s.key}">${esc(s.label)} (${s.count})</button>`)
    .join("") + `<span id="stats">${data.total} compras · ` +
    Object.entries(data.sums).map(([c, n]) => `$ ${Math.round(n).toLocaleString("es-MX")} ${esc(c)}`).join(" + ") + "</span>";

  $("more")?.remove();
  const cards = data.items.map(i => card(i, labels[i.store] || i.store)).join("");
  const shown = state.offset + data.items.length;
  const more = data.total > shown ? `<div id="more"><button>Ver más (${data.total - shown})</button></div>` : "";
  if (append) $("grid").insertAdjacentHTML("beforeend", cards + more);
  else $("grid").innerHTML = data.total ? cards + more : `<div class="empty">No encontré compras con “${esc(state.q)}”.</div>`;
}

let typing;
$("q").addEventListener("input", e => { clearTimeout(typing); typing = setTimeout(() => { state.q = e.target.value; load(); }, 150); });
$("sort").addEventListener("change", e => { state.sort = e.target.value; load(); });
$("chips").addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (chip) { state.store = chip.dataset.store; load(); }
});
$("grid").addEventListener("click", e => {
  if (e.target.closest("#more button")) { state.offset += 60; load(true); }
});
load();
</script>
</body>
</html>
